<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dense Temporal Motion Retargeting</title>
<style>
:root { --fg:#1b1b1f; --mut:#5c5c66; --bg:#fbfbfc; --card:#fff; --line:#e3e3e8; --acc:#2b5fd9; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
header { padding:40px 20px 24px; border-bottom:1px solid var(--line); background:#fff; }
.wrap { max-width:1180px; margin:0 auto; padding:0 20px; }
h1 { font-size:34px; margin:0 0 6px; letter-spacing:-.01em; }
.tag { color:var(--mut); margin:0 0 18px; }
.abs { max-width:900px; color:#333; }
nav { position:sticky; top:0; z-index:5; background:#fffc; backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
nav .wrap { display:flex; gap:18px; flex-wrap:wrap; padding:10px 20px; font-size:14px; }
nav a { color:var(--fg); text-decoration:none; } nav a:hover { color:var(--acc); }
section { padding:36px 0 8px; border-bottom:1px solid var(--line); }
section > * { max-width:1180px; margin-left:auto; margin-right:auto; padding-left:20px; padding-right:20px; }
h2 { font-size:24px; margin:0 0 10px; }
h3.sub { font-size:17px; margin:26px auto 8px; color:#333; }
h4 { margin:18px 0 6px; font-size:16px; }
p { margin:8px auto 14px; } p.note { color:var(--mut); font-size:15px; }
.grid { display:grid; gap:16px; margin:8px auto 18px; }
.cols1 { grid-template-columns:1fr; } .cols2 { grid-template-columns:repeat(2,1fr); }
.cols3 { grid-template-columns:repeat(3,1fr); } .cols4 { grid-template-columns:repeat(4,1fr); } .cols5 { grid-template-columns:repeat(5,1fr); }
@media (max-width:900px) { .cols3,.cols4,.cols5 { grid-template-columns:repeat(2,1fr); } }
@media (max-width:560px) { .grid { grid-template-columns:1fr; } }
figure.card { margin:0; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px; }
figure.card.wide { grid-column:1 / -1; }
.panels { display:flex; gap:4px; margin:0 0 6px; }
.panels span { flex:1; text-align:center; font-size:13px; color:var(--mut); border-bottom:2px solid var(--line); padding-bottom:3px; }
video { width:100%; height:auto; display:block; background:#000; border-radius:4px; }
.cap { font-size:14px; color:#333; margin:8px 2px 2px; }
.clip { margin:0 auto 6px; }
details { margin:10px auto 20px; } summary { cursor:pointer; color:var(--acc); }
footer { padding:28px 20px 48px; color:var(--mut); font-size:14px; }
.ctrl { font-size:14px; color:var(--mut); } .ctrl button { font:inherit; padding:4px 10px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
<header><div class="wrap">
<h1>Dense Temporal Motion Retargeting</h1>
<p class="tag">Supplementary videos for an anonymous conference submission</p>

<p class="ctrl">All videos are muted and loop. <button id="auto">Autoplay when visible: on</button> &nbsp; Simulation
renders unless marked <i>real robot</i>.</p>
</div></header>
<nav><div class="wrap"><a href="#videos">Videos</a></div></nav>
<section id="videos"><h2>Videos</h2>




<div class="grid cols1"><figure class="card wide"><div class="panels"><span>Human motion (SOMA body, real time)</span><span>DTMR (ours)</span></div><video muted loop playsinline controls preload="none" poster="posters/jump10__high_jump_R_002__A340_M__human_dtmr.jpg"><source src="videos/jump10/high_jump_R_002__A340_M__human_dtmr.mp4" type="video/mp4"></video></figure></div>




</section>
<footer><div class="wrap">Anonymous submission. This page contains no tracking scripts or external resources.</div></footer>
<script>
(function(){
  var on = true, vids = document.querySelectorAll('video');
  var io = new IntersectionObserver(function(es){ es.forEach(function(e){
    var v = e.target;
    if (e.isIntersecting && on) { if (v.preload === 'none') v.preload = 'auto'; v.play().catch(function(){}); }
    else if (!e.isIntersecting) v.pause();
  }); }, {threshold: 0.35});
  vids.forEach(function(v){ io.observe(v); });
  document.getElementById('auto').onclick = function(){ on = !on; this.textContent = 'Autoplay when visible: ' + (on ? 'on' : 'off');
    if (!on) vids.forEach(function(v){ v.pause(); }); };
})();
</script>
</body>
</html>
